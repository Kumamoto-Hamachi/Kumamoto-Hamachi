name: Refresh activity panel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *" # 毎日 JST 00:17

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render assets/activity.svg
        run: python3 scripts/build_activity.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet -- assets/activity.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh activity panel"
          git push
